name: Build production

# Manual only: Actions > Build production > Run workflow, then type "build". Always builds the
# current main onto the production deploy branch (cpanel-deploy), whichever branch the run is
# started from. Deploy it from cPanel by hand: Update from Remote, then Deploy HEAD Commit.
on:
    workflow_dispatch:
        inputs:
            confirm:
                description: Type "build" to build the current main for production
                type: string
                required: true

concurrency:
    group: build-production
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    confirm:
        runs-on: ubuntu-latest
        steps:
            - name: Check confirmation
              env:
                  CONFIRM: ${{ inputs.confirm }}
              run: |
                  if [ "$CONFIRM" != "build" ]; then
                      echo "::error::Type \"build\" in the confirmation box to build main for production."
                      exit 1
                  fi

    build:
        needs: confirm
        uses: ./.github/workflows/cpanel-pipeline.yml
        with:
            environment: production
            ref: main
