services:
    pgsql:
        image: postgres:17-alpine
        restart: unless-stopped
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - pgsql-data:/var/lib/postgresql/data
            - ./docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql:ro
        healthcheck:
            test:
                [
                    'CMD',
                    'pg_isready',
                    '-q',
                    '-d',
                    '${DB_DATABASE}',
                    '-U',
                    '${DB_USERNAME}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    pgsql-data:
