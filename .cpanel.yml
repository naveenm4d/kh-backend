---
# cPanel Git Version Control runs this after "Deploy HEAD Commit", on the `cpanel-deploy` branch built
# by scripts/build-cpanel-release.sh (vendor/ and public/build included). The script works out the app
# folder from its own location, finds a PHP 8.4+ CLI, migrates and caches; its output goes to
# ~/.cpanel/logs/vc_*_git_deploy.log. The path below must be where the repository is cloned.
deployment:
  tasks:
    - /bin/bash /home/subaorac/public_html/repositories/kh-backend/scripts/cpanel-deploy.sh
